name: Checkout and manifest integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tracked paths and package manifests
        run: python .github/quality/check_repository.py
  project-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run project acceptance checks
        shell: bash
        run: |
          g++ -std=c++11 -DIMGUI_DISABLE_OBSOLETE_FUNCTIONS -c imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp
          g++ -std=c++11 -I. .github/quality/imgui_smoke.cpp imgui.o imgui_draw.o imgui_tables.o imgui_widgets.o -o /tmp/imgui-smoke
          /tmp/imgui-smoke
